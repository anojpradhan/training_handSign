<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Predicting</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.10/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  </head>

  <body>
    <script>
      let handPose;
      let video;
      let hands = [];
      let classifier;

      let label = "Loading model...";
      let confidence = 0;
      let loaded = false;

      let lastClassifyTime = 0;

      function preload() {
        handPose = ml5.handPose({ flipHorizontal: false });
      }

      function setup() {
        createCanvas(640, 480);

        video = createCapture(VIDEO);
        video.size(640, 480);
        video.hide();

        classifier = ml5.neuralNetwork({ task: "classification" });

        const modelDetails = {
          model: "models/model.json",
          metadata: "models/model_meta.json",
          weights: "models/model.weights.bin",
        };

        classifier.load(modelDetails, () => {
          loaded = true;
          label = "Model Loaded hai ta ";
          console.log("Model loaded successfully");
        });

        handPose.detectStart(video, (results) => {
          hands = results;
        });
      }

      function draw() {
        image(video, 0, 0);

        let handDetected = false;

        if (hands.length > 0) {
          let hand = hands[0];

          if (hand && hand.confidence > 0.6) {
            handDetected = true;
            drawKeypoints(hand);

            if (loaded) {
              let now = millis();

              // classify every 200ms
              if (now - lastClassifyTime > 200) {
                let inputData = flattenHandData(hand);
                classifier.classify(inputData, gotResult);
                lastClassifyTime = now;
              }
            }
          }
        }

        // No hand detected
        if (!handDetected) {
          label = "No Hand";
          confidence = 0;
        }

        push();
        textSize(55);
        fill(0, 255, 100);
        textAlign(LEFT, TOP);
        text(label, 40, 80);

        if (confidence > 0.08) {
          textSize(28);
          fill(255, 220, 0);
          text(`Conf: ${(confidence * 100).toFixed(0)}%`, 40, 160);
        }
        pop();
      }

      function drawKeypoints(hand) {
        for (let kp of hand.keypoints) {
          fill(255, 100, 0);
          noStroke();
          circle(kp.x, kp.y, 10);
        }
      }

      function flattenHandData(hand) {
        let handData = [];

        let baseX = hand.keypoints[0].x;
        let baseY = hand.keypoints[0].y;

        let maxDist = 0;

        for (let i = 0; i < hand.keypoints.length; i++) {
          let dx = hand.keypoints[i].x - baseX;
          let dy = hand.keypoints[i].y - baseY;
          let dist = Math.sqrt(dx * dx + dy * dy);
          if (dist > maxDist) maxDist = dist;
        }

        if (maxDist === 0) return [];

        for (let i = 0; i < hand.keypoints.length; i++) {
          let kp = hand.keypoints[i];
          handData.push((kp.x - baseX) / maxDist);
          handData.push((kp.y - baseY) / maxDist);
        }

        return handData;
      }

      function gotResult(error, results) {
        if (error && typeof error === "object" && !error.message) {
          results = error;
          error = null;
        }

        if (error) {
          console.error("Real classification error:", error);
          return;
        }

        if (results && results.length > 0) {
          let best = results[0];

          // ignore "none" class
          if (best.label === "none") {
            label = "";
            confidence = 0;
            return;
          }

          // confidence threshold
          if (best.confidence > 0.75) {
            label = best.label;
            confidence = best.confidence;
          } else {
            label = "...";
            confidence = best.confidence;
          }
        }
      }
    </script>
  </body>
</html>
