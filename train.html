<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Train garum kta ho</title>
  </head>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.10/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>

  <script>
    let classifier;
    let handPose;
    let video;
    let hands = [];
    let isTrained = false;
    let classification = "";
    let rawData = []; // stores all { input, output } pairs across sessions

    let letters = [
      { label: "none", nep: "", count: 0 },
      { label: "a", nep: "अ", count: 0 },
      { label: "aa", nep: "आ", count: 0 },
      { label: "i", nep: "इ", count: 0 },
      { label: "ii", nep: "ई", count: 0 },
      { label: "u", nep: "उ", count: 0 },
      { label: "uu", nep: "ऊ", count: 0 },
      { label: "ri", nep: "ऋ", count: 0 },
      { label: "e", nep: "ए", count: 0 },
      { label: "ai", nep: "ऐ", count: 0 },
      { label: "o", nep: "ओ", count: 0 },
      { label: "au", nep: "औ", count: 0 },
      { label: "am", nep: "अं", count: 0 },
      { label: "aha", nep: "अः", count: 0 },
      { label: "ka", nep: "क", count: 0 },
      { label: "kha", nep: "ख", count: 0 },
      { label: "ga", nep: "ग", count: 0 },
      { label: "gha", nep: "घ", count: 0 },
      { label: "nga", nep: "ङ", count: 0 },

      { label: "cha", nep: "च", count: 0 },
      { label: "chha", nep: "छ", count: 0 },
      { label: "ja", nep: "ज", count: 0 },
      { label: "jha", nep: "झ", count: 0 },
      { label: "nya", nep: "ञ", count: 0 },

      { label: "tta", nep: "ट", count: 0 },
      { label: "ttha", nep: "ठ", count: 0 },
      { label: "dda", nep: "ड", count: 0 },
      { label: "ddha", nep: "ढ", count: 0 },
      { label: "nna", nep: "ण", count: 0 },

      { label: "ta", nep: "त", count: 0 },
      { label: "tha", nep: "थ", count: 0 },
      { label: "da", nep: "द", count: 0 },
      { label: "dha", nep: "ध", count: 0 },
      { label: "na", nep: "न", count: 0 },

      { label: "pa", nep: "प", count: 0 },
      { label: "pha", nep: "फ", count: 0 },
      { label: "ba", nep: "ब", count: 0 },
      { label: "bha", nep: "भ", count: 0 },
      { label: "ma", nep: "म", count: 0 },

      { label: "ya", nep: "य", count: 0 },
      { label: "ra", nep: "र", count: 0 },
      { label: "la", nep: "ल", count: 0 },
      { label: "wa", nep: "व", count: 0 },

      { label: "sha", nep: "श", count: 0 },
      { label: "ssa", nep: "ष", count: 0 },
      { label: "sa", nep: "स", count: 0 },
      { label: "ha", nep: "ह", count: 0 },

      { label: "ksha", nep: "क्ष", count: 0 },
      { label: "tra", nep: "त्र", count: 0 },
      { label: "gya", nep: "ज्ञ", count: 0 },
    ];

    let instructionP;
    let dataCountsP;
    let letterButtons = [];
    let trainButton;
    let lastClassifyTime = 0;
    let lastValid = "";

    function preload() {
      handPose = ml5.handPose();
    }

    function setup() {
      let container = createDiv()
        .id("container")
        .style("display", "flex")
        .style("gap", "20px");

      let videoContainer = createDiv().id("videoContainer").parent(container);
      let canvas = createCanvas(640, 480);
      canvas.parent(videoContainer);

      video = createCapture(VIDEO);
      video.size(640, 480);
      video.hide();

      let dataContainer = createDiv()
        .id("dataContainer")
        .parent(container)
        .style("width", "220px");

      instructionP = createP(
        "Gesture hold garney ani button click garney. Data save/load garna tala buttons use gara.",
      );
      instructionP.parent(dataContainer);

      dataCountsP = createP("");
      dataCountsP.parent(dataContainer);

      // Gesture buttons
      let buttonsContainer = createDiv()
        .id("buttonsContainer")
        .style("margin-top", "20px")
        .style("display", "flex")
        .style("flex-wrap", "wrap")
        .style("gap", "10px");

      letters.forEach((letter, idx) => {
        let btn = createButton(`Add ${letter.label} ko Data`);
        btn.mousePressed(() => addLetterData(idx));
        btn.parent(buttonsContainer);
        letterButtons.push(btn);
      });

      // Action buttons
      let actionContainer = createDiv()
        .style("margin-top", "16px")
        .style("display", "flex")
        .style("flex-wrap", "wrap")
        .style("gap", "8px");

      // Save raw data to JSON
      let saveDataBtn = createButton(" Save Data JSON");
      saveDataBtn.mousePressed(saveDataJSON);
      saveDataBtn.parent(actionContainer);

      // Load raw data from JSON (hidden file input)
      let loadDataInput = createElement("input");
      loadDataInput.attribute("type", "file");
      loadDataInput.attribute("accept", ".json");
      loadDataInput.style("display", "none");
      loadDataInput.changed(() => loadDataJSON(loadDataInput));
      loadDataInput.parent(actionContainer);

      let loadDataBtn = createButton(" Load Data JSON");
      loadDataBtn.mousePressed(() => loadDataInput.elt.click());
      loadDataBtn.parent(actionContainer);

      // Train & save model
      trainButton = createButton(" Train & Save Model");
      trainButton.mousePressed(train);
      trainButton.parent(actionContainer);

      // Load a previously saved model (hidden file input, accepts multiple)
      let loadModelInput = createElement("input");
      loadModelInput.attribute("type", "file");
      loadModelInput.attribute("accept", ".json,.bin");
      loadModelInput.attribute("multiple", "");
      loadModelInput.style("display", "none");
      loadModelInput.changed(() => loadTrainedModel(loadModelInput));
      loadModelInput.parent(actionContainer);

      ml5.setBackend("webgl");

      classifier = ml5.neuralNetwork({ task: "classification", debug: true });
      handPose.detectStart(video, gotHands);

      updateDataCountUI();
    }

    // Save rawData array as JSON file
    function saveDataJSON() {
      let payload = {
        letters: letters.map((l) => ({
          label: l.label,
          nep: l.nep,
          count: l.count,
        })),
        data: rawData,
      };
      let blob = new Blob([JSON.stringify(payload)], {
        type: "application/json",
      });
      let url = URL.createObjectURL(blob);
      let a = document.createElement("a");
      a.href = url;
      a.download = "gesture_data.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    //Load rawData from JSON and re-add to classifier
    function loadDataJSON(fileInput) {
      let file = fileInput.elt.files[0];
      if (!file) return;
      let reader = new FileReader();
      reader.onload = (e) => {
        let payload = JSON.parse(e.target.result);

        // Restore counts
        if (payload.letters) {
          payload.letters.forEach((saved) => {
            let found = letters.find((l) => l.label === saved.label);
            if (found) found.count = saved.count;
          });
        }

        // Restore data into classifier and rawData
        if (payload.data) {
          payload.data.forEach((item) => {
            classifier.addData(item.input, item.output);
            rawData.push(item);
          });
        }

        updateDataCountUI();
        console.log(
          `Loaded ${payload.data ? payload.data.length : 0} data points.`,
        );
      };
      reader.readAsText(file);
    }

    //Load a previously trained model
    function loadTrainedModel(fileInput) {
      // ml5 expects the model.json file; it finds weights automatically
      // We grab the JSON file from the selection
      let files = fileInput.elt.files;
      let jsonFile = Array.from(files).find(
        (f) => f.name.endsWith(".json") && !f.name.includes("meta"),
      );
      if (!jsonFile) {
        alert(
          "Please select the model.json file (and include weights.bin and metadata.json).",
        );
        return;
      }

      // Build an object-URL for the JSON and pass it to ml5
      let jsonURL = URL.createObjectURL(jsonFile);

      // ml5 neuralNetwork.load takes a model.json URL
      classifier.load(jsonURL, () => {
        console.log("Model loaded!");
        isTrained = true;
        URL.revokeObjectURL(jsonURL);
      });
    }

    function draw() {
      image(video, 0, 0, width, height);
      if (hands[0]) {
        let hand = hands[0];
        for (let i = 0; i < hand.keypoints.length; i++) {
          let keypoint = hand.keypoints[i];
          fill(0, 255, 0);
          noStroke();
          circle(keypoint.x, keypoint.y, 10);
        }
      }

      if (isTrained && hands[0]) {
        let now = millis();
        if (now - lastClassifyTime > 200) {
          let inputData = flattenHandData();
          classifier.classify(inputData, gotClassification);
          lastClassifyTime = now;
        }
        textSize(64);
        fill(0, 255, 0);
        text(classification, 20, 60);
      }
    }

    function gotHands(results) {
      hands = results;
    }

    function gotClassification(results) {
      if (!results || results.length === 0) return;

      let top = results[0];
      let label = top.label;
      let confidence = top.confidence;

      // Suppress "none" class
      if (label === "none") {
        classification = "";
        lastValid = "";
        return;
      }

      // Also suppress if "none" has notable confidence
      let noneResult = results.find((r) => r.label === "none");
      if (noneResult && noneResult.confidence > 0.35) {
        classification = "";
        lastValid = "";
        return;
      }

      // Raised threshold to 0.90
      if (confidence > 0.9) {
        let found = letters.find((l) => l.label === label);
        lastValid = found ? found.nep : label;
        classification = `${lastValid} (${confidence.toFixed(2)})`;
      } else {
        classification = lastValid ? `${lastValid} (...)` : "";
      }
    }

    function flattenHandData() {
      let hand = hands[0];
      let handData = [];
      let baseX = hand.keypoints[0].x;
      let baseY = hand.keypoints[0].y;

      let maxDist = 0;
      for (let i = 0; i < hand.keypoints.length; i++) {
        let dx = hand.keypoints[i].x - baseX;
        let dy = hand.keypoints[i].y - baseY;
        let dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > maxDist) maxDist = dist;
      }
      if (maxDist === 0) return [];

      for (let i = 0; i < hand.keypoints.length; i++) {
        let kp = hand.keypoints[i];
        handData.push((kp.x - baseX) / maxDist);
        handData.push((kp.y - baseY) / maxDist);
      }
      return handData;
    }

    function addLetterData(index) {
      if (hands[0]) {
        let inputData = flattenHandData();
        let outputData = [letters[index].label];
        classifier.addData(inputData, outputData);
        rawData.push({ input: inputData, output: outputData }); // ← also store locally
        letters[index].count++;
      }
      updateDataCountUI();
    }

    function updateDataCountUI() {
      let html = "";
      letters.forEach((l) => {
        html += `<span style="margin:3px; padding:2px 5px; border:1px solid #ccc; border-radius:4px; display:inline-block;">${l.nep} (${l.label}): ${l.count}</span>`;
      });
      dataCountsP.html(html);

      select("#dataContainer")
        .style("display", "flex")
        .style("flex-wrap", "wrap")
        .style("max-height", "480px")
        .style("overflow-y", "auto");
    }

    function train() {
      classifier.normalizeData();
      classifier.train({ epochs: 50 }, finishedTraining);
    }

    function finishedTraining() {
      console.log("Training finished!");
      classifier.save(); // saves model.json + weights.bin + metadata.json
      isTrained = true;
    }
  </script>
  <body></body>
</html>
